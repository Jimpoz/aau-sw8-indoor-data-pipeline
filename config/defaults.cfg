[project]
default_building_name = Imported Building
default_building_short_name = imported
default_space_name_prefix = Space
default_room_type = ROOM_GENERIC
default_corridor_type = CORRIDOR
default_door_type = DOOR_STANDARD
backend_import_base_url =

[input]
pdf_dpi = 400
processing_max_dimension = 3200
crop_top_fraction = 0.02
crop_right_fraction = 0.02
crop_bottom_fraction = 0.16
crop_left_fraction = 0.02
bbox_padding_px = 20

[geometry]
blur_kernel = 3
wall_open_kernel = 3
wall_dilate_kernel = 3
wall_component_min_area = 90
opening_close_kernel = 29
opening_touch_kernel = 11
opening_min_area = 60
opening_max_area = 15000
space_min_area_ratio = 0.0008
polygon_epsilon_ratio = 0.008
corridor_min_door_count = 3
corridor_min_area_ratio = 0.035
room_label_min_confidence = 45.0

[text]
ocr_engine = none
tesseract_binary = tesseract
use_pdf_metadata = true
use_filename = true
require_campus_name_if_not_inferred = true

[scale]
default_meters_per_pixel = 0.05
use_default_scale_as_fallback = false

[export]
schema_version = 1.0
emit_backend_map = true
emit_rich_translation = true
create_exterior_space = false

[debug]
save_artifacts = false
embed_debug_images = false
